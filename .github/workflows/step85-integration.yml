# Synthetic-only Step92 API/DB/AI/teacher-scope and tagged bilingual report validation. NEVER deploy or invoke a real provider.
name: "Backend integrity: Step 92"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: writing_ci
          POSTGRES_PASSWORD: synthetic_ci_password
          POSTGRES_DB: writing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U writing_ci -d writing_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://writing_ci:synthetic_ci_password@localhost:5432/writing_test?schema=public
      WEB_ORIGIN: http://localhost:3000
      PORT: '3001'
      LOCAL_PROVISION_ACK: ONLY_SYNTHETIC_TEST_DATA
      LOCAL_PROVISION_EMAIL: local-admin@example.test
      LOCAL_PROVISION_ROLE: SUPER_ADMIN
      STEP85_SYNTHETIC_ACK: ONLY_SYNTHETIC_TEST_DATA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text extraction validator
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Create CI-only ephemeral secrets
        shell: bash
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          echo "AUTH_ABUSE_KEY=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          echo "LOCAL_PROVISION_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for tagged report rendering
        run: npx playwright install --with-deps chromium
      - name: Generate synthetic bilingual PDF accessibility samples
        run: node --experimental-strip-types scripts/export-report-pdf-samples.mjs /tmp/report-pdf-samples
      - name: Install pinned veraPDF 1.30.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://software.verapdf.org/releases/1.30/verapdf-greenfield-1.30.2-installer.zip \
            --output /tmp/verapdf-installer.zip
          echo '6cc6341cb1af644044054b81f00a6590a7918abb18f762243de115258bcad838  /tmp/verapdf-installer.zip' | sha256sum --check
          mkdir -p /tmp/verapdf-installer /tmp/verapdf-installed
          unzip -q /tmp/verapdf-installer.zip -d /tmp/verapdf-installer
          cat > /tmp/verapdf-install.xml <<'EOF'
          <AutomatedInstallation langpack="eng">
            <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
            <com.izforge.izpack.panels.target.TargetPanel id="install_dir"><installpath>/tmp/verapdf-installed</installpath></com.izforge.izpack.panels.target.TargetPanel>
            <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
              <pack index="0" name="veraPDF GUI" selected="false"/>
              <pack index="1" name="veraPDF Mac and *nix Scripts" selected="true"/>
              <pack index="2" name="veraPDF Validation model" selected="true"/>
              <pack index="3" name="veraPDF Documentation" selected="false"/>
              <pack index="4" name="veraPDF Sample Plugins" selected="false"/>
            </com.izforge.izpack.panels.packs.PacksPanel>
            <com.izforge.izpack.panels.install.InstallPanel id="install"/>
            <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          EOF
          /tmp/verapdf-installer/verapdf-greenfield-1.30.2/verapdf-install /tmp/verapdf-install.xml
      - name: Validate English and Bangla PDF/UA-1 samples
        run: >-
          /tmp/verapdf-installed/verapdf --flavour ua1 --format text
          /tmp/report-pdf-samples/report-en.pdf
          /tmp/report-pdf-samples/report-bn.pdf
      - name: Block high and critical dependency advisories
        run: npm audit --audit-level=high
      - name: TypeScript domain and pure-policy checks
        run: |
          npm test
          npm run typecheck
          npm --workspace apps/api run typecheck:policies
      - name: Generate Prisma client and validate migration
        run: |
          npm --workspace apps/api run db:generate
          npm --workspace apps/api run typecheck
          npm --workspace apps/worker run typecheck
          npm --workspace apps/api run db:migrate
      - name: Database-backed safety tests (never skipped)
        run: RUN_POSTGRES_INTEGRATION=1 npm --workspace apps/api run test:db
      - name: Provision synthetic local administrator only
        run: npm --workspace apps/api run provision:local
      - name: API HTTP smoke test against local ephemeral PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          npm --workspace apps/api run start > /tmp/writing-api-step85.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 35); do
            if curl -sf http://127.0.0.1:3001/api/v1/health > /dev/null; then ready=1;break; fi
            if ! kill -0 "$api_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [[ "$ready" != '1' ]]; then
            cat /tmp/writing-api-step85.log
            echo 'API DID NOT START: live integration gate failed'
            exit 1
          fi
          node scripts/smoke-http-step85.mjs
      - name: Python AI boundary tests
        run: |
          python -m pip install -e 'apps/ai-service[test]'
          (cd apps/ai-service && python -m pytest -q)
          node --experimental-strip-types --test apps/api/test/report-policy.test.ts
      - name: Preserve synthetic bilingual PDF samples for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step115-bilingual-pdf-samples
          path: /tmp/report-pdf-samples/*.pdf
          if-no-files-found: error
          retention-days: 14
  web-portal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Authentication boundary tests
        run: npm --workspace apps/web test
      - name: Production build and typecheck
        run: |
          npm --workspace apps/web run build
          npm --workspace apps/web run typecheck
      - name: Install Chromium for actual browser tests
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser workflows against synthetic upstream
        run: npm --workspace apps/web run test:e2e
      - name: Preserve synthetic browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step93-browser-evidence
          path: apps/web/test-results
          retention-days: 7
  web-fullstack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: writing_ci
          POSTGRES_PASSWORD: synthetic_ci_password
          POSTGRES_DB: writing_browser_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U writing_ci -d writing_browser_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://writing_ci:synthetic_ci_password@127.0.0.1:5432/writing_browser_test?schema=public
      WRITING_FULLSTACK_ACK: ONLY_SYNTHETIC_TEST_DATA
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies and migrate disposable browser database
        run: |
          npm ci --no-audit --no-fund
          npm --workspace apps/api run db:generate
          npm --workspace apps/api run db:migrate
          npx tsc --noEmit -p apps/api/tsconfig.browser.json
          node --test scripts/fullstack-safety.test.mjs
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile through actual Next.js, NestJS and PostgreSQL
        run: npm --workspace apps/web run test:e2e:fullstack
      - name: Preserve synthetic full-stack failure traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step93-fullstack-browser-evidence
          path: apps/web/test-results-fullstack
          retention-days: 7
